<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B5E4B">
<meta name="robots" content="noindex, nofollow">
<title>도쿄 크리스마스 여행 🎄</title>
<style>
  :root{
    --page:#FAF6F0; --card:#FFFFFF; --soft:#F1EAE0; --text:#241E17; --text2:#5F564B; --text3:#8B8175;
    --line:#E7DED1; --green:#1B5E4B; --green-l:#2A8A6E; --gold:#BE9150; --red:#C93A52;
  }
  @media (prefers-color-scheme: dark){
    :root{ --page:#14110E; --card:#1D1915; --soft:#2B241D; --text:#F3ECE2; --text2:#C2B5A4; --text3:#94887A;
           --line:#342C24; --green:#2A8A6E; --green-l:#3AA383; --gold:#C9A063; --red:#E8697F; }
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;background:var(--page);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Helvetica Neue",Arial,sans-serif;
    font-size:15px;line-height:1.55;display:flex;align-items:center;justify-content:center;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));word-break:keep-all;overflow-wrap:break-word;
    -webkit-font-smoothing:antialiased;
  }
  .stage{width:100%;max-width:390px}
  .badge{
    width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;
    background:linear-gradient(145deg,rgba(27,94,75,.10),rgba(190,145,80,.14));
    border:1px solid var(--line);margin-bottom:18px;
  }
  h1{font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
  .sub{margin-top:6px;font-size:13px;color:var(--text2)}
  form{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;
       box-shadow:0 1px 2px rgba(36,30,23,.04),0 10px 30px -18px rgba(36,30,23,.25)}
  label.lb{display:block;font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.01em;margin-bottom:7px}
  .field{position:relative;display:flex;align-items:center}
  input[type=password],input[type=text]{
    width:100%;height:50px;padding:0 62px 0 14px;border:1.5px solid var(--line);border-radius:12px;
    background:var(--page);color:var(--text);font-size:17px;letter-spacing:.02em;
    transition:border-color .15s ease,background .15s ease;
  }
  input:focus{outline:none;border-color:var(--green-l);background:var(--card)}
  .eye{
    position:absolute;right:6px;height:38px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:var(--text3);
    font-size:12.5px;font-weight:700;cursor:pointer;
  }
  .eye:active{background:var(--soft)}
  .err{margin-top:9px;font-size:12.5px;font-weight:600;color:var(--red);min-height:0;display:none}
  .err.on{display:block}
  .chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--text2);cursor:pointer;user-select:none}
  .chk input{width:18px;height:18px;accent-color:var(--green);flex:none}
  button.go{
    width:100%;height:52px;margin-top:16px;border:0;border-radius:13px;background:var(--green);color:#fff;
    font-size:16px;font-weight:800;letter-spacing:-.01em;cursor:pointer;
    transition:transform .08s ease,opacity .15s ease;
  }
  button.go:active{transform:scale(.985)}
  button.go[disabled]{opacity:.62}
  .foot{margin-top:20px;font-size:12px;line-height:1.65;color:var(--text3);text-align:center}
  .foot b{color:var(--text2);font-weight:600}
  .shake{animation:sh .34s cubic-bezier(.36,.07,.19,.97)}
  @keyframes sh{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .overlay{
    position:fixed;inset:0;background:var(--page);display:none;place-items:center;z-index:9;
  }
  .overlay.on{display:grid}
  .spin{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ovtxt{margin-top:12px;font-size:13px;color:var(--text2);text-align:center}
</style>
</head>
<body>
  <main class="stage">
    <div class="badge" aria-hidden="true">🎄</div>
    <h1>도쿄 크리스마스 여행</h1>
    <p class="sub">2026년 12월 24일 – 27일 · 잠금 문서</p>

    <form id="f" novalidate>
      <label class="lb" for="pw">비밀번호</label>
      <div class="field">
        <input id="pw" type="password" inputmode="text" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="비밀번호 입력" aria-describedby="err">
        <button class="eye" type="button" id="eye" aria-label="비밀번호 보기">보기</button>
      </div>
      <p class="err" id="err" role="alert"></p>
      <label class="chk"><input type="checkbox" id="remember" checked><span>이 기기에서 기억하기</span></label>
      <button class="go" type="submit" id="go">열기</button>
    </form>

    <p class="foot">여행 일정이 담긴 <b>잠금 문서</b>예요.<br>비밀번호는 두 사람에게만 공유해 주세요.</p>
  </main>

  <div class="overlay" id="ov" role="status" aria-live="polite">
    <div>
      <div class="spin" aria-hidden="true"></div>
      <div class="ovtxt" id="ovtxt">여는 중…</div>
    </div>
  </div>

  }
  function bytesToB64(b){
    var s = "";
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function showErr(msg){ errEl.textContent = msg; errEl.classList.add("on"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }
  function clearErr(){ errEl.classList.remove("on"); errEl.textContent = ""; }
  function busy(on, msg){ ovtxt.textContent = msg || "여는 중…"; ov.classList.toggle("on", !!on); go.disabled = !!on; }

  var SALT = b64ToBytes(SALT_B64), IV = b64ToBytes(IV_B64);
  var PAYLOAD = null;
  function payload(){ if (!PAYLOAD) PAYLOAD = b64ToBytes($("payload").textContent); return PAYLOAD; }

  function deriveKey(pass){
    var enc = new TextEncoder().encode(pass);
    return crypto.subtle.importKey("raw", enc, { name: "PBKDF2" }, false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: SALT, iterations: ITER, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
      );
    });
  }
  function openWith(key){
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: IV }, key, payload()).then(function(buf){
      return new TextDecoder("utf-8").decode(buf);
    });
  }
  /* 복호화한 전체 문서로 화면을 바꿉니다.
     document.write/open은 문서 상태에 따라 교체가 아니라 덧붙기 때문에,
     파싱한 문서의 head/body를 직접 갈아끼우고 스크립트만 순서대로 실행합니다. */
  function runScripts(container){
    var list = container.querySelectorAll("script");
    for (var i = 0; i < list.length; i++) {
      var code = list[i].textContent;
      if (!code) continue;
      try { (0, eval)(code); } catch (e) {}
    }
  }
  function render(html){
    var parsed = new DOMParser().parseFromString(html, "text/html");
    if (parsed.title) { try { document.title = parsed.title; } catch (e) {} }
    var head = document.head, i, node;
    while (head.firstChild) head.removeChild(head.firstChild);
    for (i = 0; i < parsed.head.childNodes.length; i++) {
      node = document.importNode(parsed.head.childNodes[i], true);
      if (node.nodeName === "SCRIPT") continue;
      head.appendChild(node);
    }
    var body = document.body;
    body.innerHTML = parsed.body.innerHTML;
    if (parsed.body.getAttribute("class")) body.setAttribute("class", parsed.body.getAttribute("class"));
    runScripts(body);
    window.scrollTo(0, 0);
  }
  function whenLoaded(fn){
    if (document.readyState === "complete") { setTimeout(fn, 0); return; }
    window.addEventListener("load", function(){ setTimeout(fn, 0); });
  }
  function memorize(key){
    try {
      return crypto.subtle.exportKey("raw", key).then(function(raw){
        try { localStorage.setItem(REMEMBER_KEY, bytesToB64(new Uint8Array(raw))); } catch (e) {}
      });
    } catch (e) { return Promise.resolve(); }
  }

  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    clearErr();
    var pass = pw.value;
    if (!pass) { showErr("비밀번호를 입력해 주세요."); pw.focus(); return; }
    if (!window.crypto || !crypto.subtle) { showErr("이 브라우저에서는 잠금 해제를 지원하지 않아요. Safari나 Chrome 최신 버전으로 열어 주세요."); return; }
    busy(true);
    deriveKey(pass).then(function(key){
      return openWith(key).then(function(html){
        var done = $("remember").checked ? memorize(key) : Promise.resolve();
        return done.then(function(){ render(html); });
      });
    }).catch(function(){
      busy(false);
      showErr("비밀번호가 맞지 않아요. 다시 확인해 주세요.");
      pw.select();
    });
  });

  eye.addEventListener("click", function(){
    var showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    eye.textContent = showing ? "보기" : "숨기기";
    eye.setAttribute("aria-label", showing ? "비밀번호 보기" : "비밀번호 숨기기");
    pw.focus();
  });

  // 저장된 열쇠로 자동 잠금 해제
  (function auto(){
    var saved = null;
    try { saved = localStorage.getItem(REMEMBER_KEY); } catch (e) {}
    if (!saved) return;
    if (!window.crypto || !crypto.subtle) return;
    whenLoaded(function(){
      var slow = setTimeout(function(){ busy(true, "여는 중…"); }, 250);
      crypto.subtle.importKey("raw", b64ToBytes(saved), { name: "AES-GCM" }, false, ["decrypt"]).then(function(key){
        return openWith(key).then(render).catch(function(){ throw new Error("bad key"); });
      }).catch(function(){
        clearTimeout(slow);
        try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
        busy(false);
        showErr("저장된 잠금 해제 정보로 열지 못했어요. 비밀번호를 다시 입력해 주세요.");
      });
    });
  })();

  pw.focus();
})();
</script>
</body>
</html>
